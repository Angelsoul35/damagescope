[project]
name = "damagescope"
version = "1.0.0"
description = "Vehicle damage detection with classical computer vision: HOG + classifier to flag damage, image-processing localization with bounding boxes and IoU, severity and cost estimate, and ONNX export for CPU inference."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Angelo David Padilla Romero" }]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "numpy>=2.1",
  "pillow>=11.0",
  "scikit-image>=0.24",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "python-multipart>=0.0.12",
]

[project.optional-dependencies]
onnx = ["skl2onnx>=1.17", "onnxruntime>=1.20"]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8", "httpx>=0.28"]

[project.scripts]
damagescope = "damagescope.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["damagescope*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008"]
